name: ARM64 APK install smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - work/final-browser

permissions:
  actions: read
  contents: read

concurrency:
  group: titanium-personal-arm64-install-smoke
  cancel-in-progress: false

jobs:
  install-smoke:
    name: Install and launch ARM64 APK on Android 16
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout validation instructions
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download signed ARM64 contingency APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded diagnostics
          gh run download 31257603213 \
            --repo "$GITHUB_REPOSITORY" \
            --name titanium-browser-personal-upstream-contingency-3ee09afd0946c4d8a579138b7c801f050a338c8f \
            --dir downloaded
          test -s downloaded/Titanium-Browser-Personal-upstream-contingency-arm64-v8a.apk
          actual_sha="$(shasum -a 256 downloaded/Titanium-Browser-Personal-upstream-contingency-arm64-v8a.apk | awk '{print $1}')"
          [[ "$actual_sha" == 'd8073562ba9b567370872bb985d6728ee4860116b80edc0f5662c099a7697da5' ]]

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android SDK command-line tools
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            --output "$tools_zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip'
          printf '%s  %s\n' \
            '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' \
            "$tools_zip" | sha256sum --check --strict
          mkdir -p "$sdk_root/cmdline-tools" "$RUNNER_TEMP/android-tools-unpack"
          unzip -q "$tools_zip" -d "$RUNNER_TEMP/android-tools-unpack"
          mv "$RUNNER_TEMP/android-tools-unpack/cmdline-tools" \
            "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"

      - name: Install Android 16 Google APIs emulator image
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | sdkmanager --licenses > diagnostics/sdk-licenses.log
          license_rc="${PIPESTATUS[1]}"
          set -o pipefail
          [[ "$license_rc" -eq 0 ]]
          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' \
            | tee diagnostics/sdk-install.log
          printf 'no\n' | avdmanager create avd \
            --force \
            --name titanium-api36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_6

      - name: Boot Android 16 emulator with KVM
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          adb start-server
          emulator -accel-check | tee diagnostics/emulator-acceleration.txt
          emulator @titanium-api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -memory 4096 \
            > diagnostics/emulator.log 2>&1 &
          echo "$!" > diagnostics/emulator.pid
          sleep 10
          ps -ef | grep -E '[e]mulator|[q]emu' > diagnostics/emulator-processes.txt
          adb devices -l | tee diagnostics/adb-devices-initial.txt
          device_deadline=$((SECONDS + 900))
          until [[ "$(adb get-state 2>/dev/null || true)" == device ]]; do
            if (( SECONDS >= device_deadline )); then
              echo 'Timed out waiting for the ARM64 emulator device' >&2
              exit 1
            fi
            sleep 10
          done
          boot_deadline=$((SECONDS + 2400))
          until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            if (( SECONDS >= boot_deadline )); then
              echo 'Timed out waiting for Android boot completion' >&2
              exit 1
            fi
            sleep 10
          done
          adb shell getprop | tee diagnostics/device-properties.txt
          adb shell getprop ro.product.cpu.abilist \
            | tee diagnostics/device-abi-list.txt
          adb shell getprop ro.dalvik.vm.native.bridge \
            | tee diagnostics/native-bridge.txt
          adb shell input keyevent 82

      - name: Install and launch signed APK
        run: |
          set -euo pipefail
          apk='downloaded/Titanium-Browser-Personal-upstream-contingency-arm64-v8a.apk'
          package='io.github.jqssun.helium'
          adb logcat -c
          adb install --no-streaming "$apk" | tee diagnostics/adb-install.txt
          adb shell pm path "$package" | tee diagnostics/package-path.txt
          adb shell dumpsys package "$package" > diagnostics/package-dumpsys.txt
          grep -E 'versionCode=|versionName=|primaryCpuAbi=' diagnostics/package-dumpsys.txt \
            | head -n 20 | tee diagnostics/installed-version.txt
          adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 \
            | tee diagnostics/launch.txt
          sleep 45
          adb shell pidof "$package" | tee diagnostics/process-id.txt
          test -s diagnostics/process-id.txt
          adb exec-out screencap -p > diagnostics/first-launch.png
          adb logcat -d -v threadtime > diagnostics/logcat.txt
          if grep -En 'FATAL EXCEPTION.*io.github.jqssun.helium|Process: io.github.jqssun.helium.*FATAL EXCEPTION' diagnostics/logcat.txt; then
            echo 'Fatal application exception detected after launch' >&2
            exit 1
          fi

      - name: Stop emulator
        if: always()
        run: |
          adb emu kill || true

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: titanium-arm64-install-smoke-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
