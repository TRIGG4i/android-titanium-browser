name: Final ARM64 source build

on:
  workflow_dispatch:
  push:
    branches:
      - work/final-browser

permissions:
  contents: read

concurrency:
  group: titanium-personal-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Chromium ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Record runner resources
        run: |
          set -euxo pipefail
          uname -a
          nproc
          free -h
          df -h
          git submodule status

      - name: Reclaim safe runner space
        run: |
          set -euxo pipefail
          for runner_path in \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android
          do
            if [[ -e "$runner_path" ]]; then
              sudo rm -rf -- "$runner_path"
            fi
          done
          sudo docker system prune --all --force --volumes
          sudo apt-get clean
          df -h

      - name: Build Chromium public APK for ARM64
        run: |
          set -o pipefail
          chmod +x build.sh common.sh patch.sh res/icon.sh
          ./build.sh 2>&1 | tee source-build.log

      - name: Validate source APK
        run: |
          set -euxo pipefail
          apk='artifacts/Titanium-Browser-Personal-source-arm64-v8a.apk'
          test -s "$apk"
          file "$apk" | tee artifacts/file-report.txt
          unzip -tq "$apk"

          mapfile -t abi_dirs < <(zipinfo -1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          printf '%s\n' "${abi_dirs[@]}" | tee artifacts/abis.txt
          [[ "${#abi_dirs[@]}" -eq 1 && "${abi_dirs[0]}" == 'arm64-v8a' ]]

          aapt2="$(find chromium/src/third_party/android_sdk/public/build-tools -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          "$aapt2" dump badging "$apk" | tee artifacts/aapt-badging.txt

          apksigner="$(find chromium/src/third_party/android_sdk/public/build-tools -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          if "$apksigner" verify --verbose --print-certs "$apk" > artifacts/source-signature.txt 2>&1; then
            echo 'source_signature=present' | tee artifacts/source-signature-state.txt
          else
            echo 'source_signature=absent_or_nonrelease' | tee artifacts/source-signature-state.txt
          fi

          sha256sum "$apk" | tee artifacts/SOURCE_SHA256SUMS.txt
          du -h "$apk" | tee artifacts/size.txt

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          if [[ -f source-build.log ]]; then
            cp source-build.log diagnostics/source-build.log
          fi
          df -h > diagnostics/disk-final.txt
          free -h > diagnostics/memory-final.txt
          git rev-parse HEAD > diagnostics/repository-commit.txt
          git -C vanadium rev-parse HEAD > diagnostics/vanadium-commit.txt

      - name: Upload source APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-personal-source-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-personal-build-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
